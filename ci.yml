name: Test suite

on: [push, pull_request]

# Least privilege: the token is read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  unit_tests:
    runs-on: ${{matrix.os}}
    strategy:
      max-parallel: 8
      matrix:
        os: [ubuntu-22.04, ubuntu-latest, macos-15, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{matrix.python-version}}
        allow-prereleases: true
    - name: Install jq
      run: |
        if [[ $(uname) == Linux ]]; then sudo apt-get install --yes jq; fi
        if [[ $(uname) == Darwin ]]; then brew install jq; fi
    - run: make install
    - if: ${{matrix.python-version == '3.14'}}
      run: make lint
    - run: make test
    - uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
      - uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
        with:
          args: "format --check"
